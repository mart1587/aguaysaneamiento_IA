<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lámina 20 · Lo que entrega cuando el prompt tiene reglas</title>
<style>
html,body{margin:0;height:100%;background:#0B1F2A;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center;background:#0B1F2A;font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;color:#EEF4F3}
.eyebrow{position:absolute;left:128px;top:128px;margin:0;font:600 24px/1.2 Consolas,"Courier New",monospace;letter-spacing:3px;text-transform:uppercase;color:#E8892B}
h2{position:absolute;left:128px;top:178px;width:1664px;margin:0;font:700 64px/1.08 "Segoe UI","Helvetica Neue",Arial,sans-serif;letter-spacing:-.5px}
iframe{position:absolute;left:128px;top:300px;width:1664px;height:620px;border:0;border-radius:12px;background:#071820}
.pg{position:absolute;right:128px;bottom:64px;margin:0;font:24px Consolas,"Courier New",monospace;color:#9DB7BC}
.hint{position:fixed;left:16px;bottom:12px;margin:0;font:14px Arial,sans-serif;color:#6F8C93;transition:opacity .6s}
</style></head><body>
<div id="stage">
<p class="eyebrow">Animación 3 · La IA trabajando</p>
<h2>Lo que entrega cuando el prompt tiene reglas</h2>
<iframe id="anim" title="Lo que entrega cuando el prompt tiene reglas" srcdoc="&lt;!doctype html&gt;&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
html,body{margin:0;height:100%;background:#071820;color:#EEF4F3;font-family:system-ui,Segoe UI,Arial,sans-serif;overflow:hidden}
.w{display:flex;gap:32px;padding:28px;height:100%;box-sizing:border-box}
.l{flex:0 0 640px;background:#0F2C38;border-radius:14px;padding:24px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px}
.h{font-size:24px;color:#9DB7BC;font-weight:600;letter-spacing:2px}
#p{font-family:Consolas,ui-monospace,monospace;font-size:24px;line-height:1.45;white-space:pre-wrap;min-height:420px}
.cur{display:inline-block;width:12px;height:26px;background:#E8892B;vertical-align:-4px;animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}
.r{flex:1;display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:1.5fr 1fr 1.3fr;gap:12px;font-size:24px;padding:12px 16px;border-radius:8px;background:#0F2C38;opacity:0;transform:translateY(12px);transition:all .45s}
.row.on{opacity:1;transform:none}.row.hd{background:transparent;color:#9DB7BC;font-weight:600}
.row.miss{background:#3A2A16;color:#F0B26B;font-weight:600}
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;div class=&quot;w&quot;&gt;
&lt;div class=&quot;l&quot;&gt;&lt;div class=&quot;h&quot;&gt;PROMPT&lt;/div&gt;&lt;div id=&quot;p&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;r&quot;&gt;&lt;div class=&quot;h&quot;&gt;RESPUESTA&lt;/div&gt;
&lt;div class=&quot;row hd&quot;&gt;Parámetro&lt;span&gt;Valor&lt;/span&gt;&lt;span&gt;Fuente&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;row&quot;&gt;Dotación con arrastre&lt;span&gt;80 L/hab/d&lt;/span&gt;&lt;span&gt;R.M. 192-2018&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;row&quot;&gt;Coeficiente K1&lt;span&gt;1,3&lt;/span&gt;&lt;span&gt;R.M. 192-2018&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;row&quot;&gt;Población de diseño&lt;span&gt;545 hab.&lt;/span&gt;&lt;span&gt;Cálculo&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;row&quot;&gt;Caudal máximo diario&lt;span&gt;0,63 L/s&lt;/span&gt;&lt;span&gt;Cálculo&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;row miss&quot;&gt;Disponibilidad hídrica&lt;span&gt;[DATO FALTANTE]&lt;/span&gt;&lt;span&gt;Pedir a la ANA&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;row miss&quot;&gt;Terreno del reservorio&lt;span&gt;[DATO FALTANTE]&lt;/span&gt;&lt;span&gt;Acta comunal&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/div&gt;
&lt;script&gt;
const txt=&#x27;Actúa como formulador de proyectos de saneamiento rural.\nUsa solo las fuentes adjuntas.\nCalcula la demanda al año 20.\nSi falta un dato, escribe [DATO FALTANTE].\nTabla: Parámetro | Valor | Fuente.&#x27;,P=document.getElementById(&#x27;p&#x27;),R=[...document.querySelectorAll(&#x27;.row&#x27;)];
let i=0,t0=performance.now();
function loop(now){const t=(now-t0)/1000;const n=Math.min(txt.length,Math.floor(t*22));P.innerHTML=txt.slice(0,n).replace(/\[DATO FALTANTE\]/,&#x27;&lt;b style=&quot;color:#E8892B&quot;&gt;[DATO FALTANTE]&lt;/b&gt;&#x27;)+&#x27;&lt;span class=&quot;cur&quot;&gt;&lt;/span&gt;&#x27;;
const st=txt.length/22+0.4;R.forEach((r,k)=&gt;r.classList.toggle(&#x27;on&#x27;,t&gt;st+k*0.7));
if(t&gt;st+R.length*0.7+4.5){t0=now}requestAnimationFrame(loop)}
requestAnimationFrame(loop);
&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;"></iframe>
<p class="pg">20</p>
</div>
<p class="hint" id="hint">F o doble clic: pantalla completa · R: reiniciar la animación</p>
<script>
const st=document.getElementById('stage');
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);st.style.transform='translate(-50%,-50%) scale('+s+')';}
addEventListener('resize',fit);fit();
function fs(){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();}
addEventListener('keydown',e=>{if(e.key==='f'||e.key==='F')fs();if(e.key==='r'||e.key==='R'){const f=document.getElementById('anim');f.srcdoc=f.srcdoc;}});
addEventListener('dblclick',fs);
setTimeout(()=>document.getElementById('hint').style.opacity=0,4000);
</script>
</body></html>
